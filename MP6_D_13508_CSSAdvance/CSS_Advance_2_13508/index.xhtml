<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>FORMULIR PENDAFTARAN KEGIATAN &amp; Workshop</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div class="wrapper">
        <h1>FORMULIR PENDAFTARAN KEGIATAN</h1>
        <form action="" method="post" enctype="multipart/form-data">
            
            <!-- Tabel Data Pendaftar -->
            <fieldset class="form-section">
                <legend>Informasi Pendaftar</legend>
                <table class="form-table">
                    <tr>
                        <td class="col-label"><label for="nama">Nama Lengkap</label></td>
                        <td><input type="text" id="nama" name="nama" class="input-control" placeholder="Tulis nama lengkap Anda..." /></td>
                    </tr>
                    <tr>
                        <td class="col-label"><label for="nim">NIM / ID Mahasiswa</label></td>
                        <td><input type="text" id="nim" name="nim" class="input-control" placeholder="Masukkan 9 digit NIM..." /></td>
                    </tr>
                    <tr>
                        <td class="col-label"><label for="prodi">Program Studi</label></td>
                        <td>
                            <select id="prodi" name="prodi" class="input-control">
                                <option value="Informatika">Informatika</option>
                                <option value="Sistem Informasi">Sistem Informasi</option>
                                <option value="Teknik Industri">Teknik Industri</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td class="col-label">Gender / Jenis Kelamin</td>
                        <td>
                            <label class="radio-label"><input type="radio" name="jk" value="Laki-laki" /> Laki-laki</label>
                            <label class="radio-label"><input type="radio" name="jk" value="Perempuan" /> Perempuan</label>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <!-- Tabel Pilihan Kegiatan -->
            <fieldset class="form-section">
                <legend>Pilihan Sesi &amp; Minat</legend>
                <table class="form-table">
                    <tr>
                        <td class="col-label">Kategori Kegiatan</td>
                        <td>
                            <label class="radio-label"><input type="radio" name="kegiatan" value="Seminar" /> Seminar Umum</label>
                            <label class="radio-label"><input type="radio" name="kegiatan" value="Pelatihan" /> Workshop / Pelatihan</label>
                            <label class="radio-label"><input type="radio" name="kegiatan" value="Diskusi" /> Diskusi Panel</label>
                        </td>
                    </tr>
                    <tr>
                        <td class="col-label">Fokus / Bidang Minat</td>
                        <td>
                            <label class="checkbox-label"><input type="checkbox" name="minat" value="Teknologi" /> Teknologi &amp; AI</label>
                            <label class="checkbox-label"><input type="checkbox" name="minat" value="Organisasi" /> Kepemimpinan &amp; Organisasi</label>
                            <label class="checkbox-label"><input type="checkbox" name="minat" value="Karier" /> Pengembangan Karier</label>
                        </td>
                    </tr>
                    <tr>
                        <td class="col-label"><label for="waktu">Pilihan Waktu Pelaksanaan</label></td>
                        <td>
                            <select id="waktu" name="waktu" class="input-control">
                                <option value="Pagi">Pagi (08.00 - 11.30 WIB)</option>
                                <option value="Siang">Siang (13.00 - 15.30 WIB)</option>
                                <option value="Sore">Sore (16.00 - 18.00 WIB)</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <!-- Tabel Kelengkapan Pendaftaran -->
            <fieldset class="form-section">
                <legend>Kelengkapan Berkas</legend>
                <table class="form-table">
                    <tr>
                        <td class="col-label" style="vertical-align:top;"><label for="harapan">Ekspektasi / Harapan</label></td>
                        <td><textarea id="harapan" name="harapan" rows="4" class="input-control" placeholder="Apa yang ingin Anda dapatkan dari kegiatan ini?"></textarea></td>
                    </tr>
                    <tr>
                        <td class="col-label"><label for="bukti">Unggah Bukti Transaksi</label></td>
                        <td><input type="file" id="bukti" name="bukti" class="file-control" /></td>
                    </tr>
                </table>
            </fieldset>

            <div class="submit-wrapper">
                <input type="submit" name="submit" value="Kirim Pendaftaran" class="btn-primary" />
            </div>
        </form>
    </div>
</body>
</html>
